<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <meta
      name="description"
      content="Viralize sua Marca com IA — da pesquisa à publicação, em um só fluxo. A Memorável vigia canais, escreve e refina com a voz da sua marca e publica com a sua aprovação."
    />
    <title>Memorável — Viralize sua Marca com IA</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint; without one, CSS follows the system.
      try {
        var t = localStorage.getItem("memorable-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
